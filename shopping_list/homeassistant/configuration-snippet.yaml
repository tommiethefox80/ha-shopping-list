# Optional. Assist and Alexa work through the to-do sync (no YAML needed).
# This rest_command calls the add-on's own API directly, e.g. from an automation.
# 1. In the add-on options set api_token, and in secrets.yaml:
#      shopping_list_auth: "Bearer <the same token>"
# 2. Add this to configuration.yaml and restart Home Assistant.

rest_command:
  shopping_list_add:
    # The add-on's hostname is on its Info page (e.g. aeb98774-shopping-list).
    # If you run the Docker version on the NUC instead, use http://<nuc-ip>:8099/api/items
    url: "http://aeb98774-shopping-list:8099/api/items"
    method: POST
    headers:
      authorization: !secret shopping_list_auth
    content_type: "application/json"
    payload: '{"text": {{ item | tojson }}, "source": "home-assistant"}'


# Optional: "What's for tea?" on a dashboard (no token needed if api_token is empty).
rest:
  - resource: "http://aeb98774-shopping-list:8099/api/meals/today"
    scan_interval: 900
    sensor:
      - name: "Tonight's dinner"
        value_template: "{{ value_json.meal or 'Nothing planned' }}"
        icon: mdi:silverware-fork-knife
