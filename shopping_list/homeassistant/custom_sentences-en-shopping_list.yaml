# Save as /config/custom_sentences/en/shopping_list.yaml
# "Add 2 beans to the shopping list" -> adds "2 beans" (quantity is understood).
# Note: this replaces HA's built-in shopping list sentence for "shopping list".
language: "en"
intents:
  ShoppingListAdd:
    data:
      - sentences:
          - "add {item} to [the] shopping list"
          - "put {item} on [the] shopping list"
lists:
  item:
    wildcard: true
