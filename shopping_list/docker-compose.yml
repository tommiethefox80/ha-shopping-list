# Alternative to the Home Assistant add-on: run on any Docker host (e.g. the NUC).
services:
  shopping-list:
    build: .
    ports:
      - "8099:8099"
    environment:
      DATA_DIR: /data
      API_TOKEN: ""          # set one if the port is reachable from outside your LAN
    volumes:
      - ./data:/data
    restart: unless-stopped
