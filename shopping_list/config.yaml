name: Shopping List
version: "3.5.0"
slug: shopping_list
description: Shared household shopping list with usuals, barcode scanning and products you always buy
url: https://github.com/tommiethefox80/ha-shopping-list
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:cart-outline
panel_title: Shopping
# Lets the add-on talk to Home Assistant's to-do lists (Assist, Alexa, the To-do dashboard).
homeassistant_api: true
options:
  ha_todo_entities:
    - todo.shopping_list
  ha_sync_list: ""
  api_token: ""
schema:
  ha_todo_entities:
    - str
  ha_sync_list: str?
  api_token: password?
