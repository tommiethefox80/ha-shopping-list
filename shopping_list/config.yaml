name: Shopping List
version: "1.1.0"
slug: shopping_list
description: Shared shopping list with usuals, barcode scanning and a Send to Tesco basket button
url: https://github.com/tommiethefox80/ha-shopping-list
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cart-outline
panel_title: Shopping
options:
  headless: false
  api_token: ""
schema:
  headless: bool
  api_token: password?
  tesco_base_url: url?
