name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server – install, typecheck, test (real Chrome against a mock Tesco)
        working-directory: shopping_list/server
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Web – install and build
        working-directory: shopping_list/web
        run: |
          npm ci
          npm run build

  docker:
    # Build exactly as Home Assistant Supervisor does (it passes its Alpine base as BUILD_FROM),
    # on both architectures the add-on supports.
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build add-on image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/base:latest -t shopping-list:ci shopping_list
      - name: Smoke test the image
        run: |
          docker run -d --name sl -p 8099:8099 -e DATA_DIR=/tmp/data shopping-list:ci
          for i in $(seq 1 30); do curl -sf localhost:8099/api/state >/dev/null && break; sleep 2; done
          curl -sf localhost:8099/api/state | head -c 200; echo
          curl -sf localhost:8099/ | grep -q '<div id="root">'
          docker exec sl node -e "require('/app/server/node_modules/playwright').chromium.launch().then(b=>{console.log('chromium ok');return b.close()})"
      - name: Container logs
        if: always()
        run: docker logs sl 2>&1 | tail -60 || true

  release:
    # Releases are driven by config.yaml: when main has a version with no release yet,
    # tag it and publish the release (notes taken from CHANGELOG.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Release new add-on version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -E '^version:' shopping_list/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v already released"; exit 0
          fi
          notes=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' shopping_list/CHANGELOG.md)
          gh release create "v$v" --target "$GITHUB_SHA" --title "Shopping List v$v" --notes "${notes:-Version $v}"
