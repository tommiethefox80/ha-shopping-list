name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server – install, typecheck, test (real Chrome against a mock Tesco)
        working-directory: shopping_list/server
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Web – install and build
        working-directory: shopping_list/web
        run: |
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build add-on image (amd64)
        run: docker build -t shopping-list:ci shopping_list

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches add-on version
        run: |
          v=$(grep -E '^version:' shopping_list/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != config.yaml version $v"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' shopping_list/CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "Shopping List $GITHUB_REF_NAME" --notes "$notes"
