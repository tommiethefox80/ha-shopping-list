name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server – install, typecheck, test (real Chrome against a mock Tesco)
        working-directory: shopping_list/server
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Web – install and build
        working-directory: shopping_list/web
        run: |
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build add-on image (amd64)
        run: docker build -t shopping-list:ci shopping_list

  release:
    # Releases are driven by config.yaml: when main has a version with no release yet,
    # tag it and publish the release (notes taken from CHANGELOG.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Release new add-on version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -E '^version:' shopping_list/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v already released"; exit 0
          fi
          notes=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' shopping_list/CHANGELOG.md)
          gh release create "v$v" --target "$GITHUB_SHA" --title "Shopping List v$v" --notes "${notes:-Version $v}"
